<div class="chat-agente-page">
  <div class="chat-container">

    <!-- Encabezado -->
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar-dot"></div>
        <div>
          <h3 class="header-titulo">Asistente CRE</h3>
          <span class="header-subtitulo">Tramites en linea</span>
        </div>
      </div>
      <div *ngIf="estadoBadge" class="badge-estado" [ngClass]="getBadgeClass()">
        {{ getBadgeTexto() }}
      </div>
    </div>

    <!-- Mensajes -->
    <div class="mensajes-container" #mensajesContainer>

      <div *ngIf="mensajes.length === 0" class="bienvenida">
        <p class="bienvenida-texto">Bienvenido al asistente de tramites de CRE.</p>
        <p class="bienvenida-subtexto">Puede ayudarte a iniciar un tramite, subir documentos y hacer seguimiento en tiempo real.</p>
        <div class="sugerencias">
          <button class="btn-sugerencia" (click)="enviarConfirmacion('Quiero instalar un nuevo medidor')">
            Nueva instalacion de medidor
          </button>
          <button class="btn-sugerencia" (click)="enviarConfirmacion('Quiero reconectar mi servicio')">
            Reconexion de servicio
          </button>
          <button class="btn-sugerencia" (click)="enviarConfirmacion('Tengo una queja sobre mi factura')">
            Reclamo de factura
          </button>
        </div>
      </div>

      <div
        *ngFor="let msg of mensajes"
        class="mensaje-wrapper"
        [class.mensaje-wrapper--agente]="msg.rol === 'agente'"
        [class.mensaje-wrapper--cliente]="msg.rol === 'cliente'">

        <div class="burbuja" [class.burbuja--agente]="msg.rol === 'agente'" [class.burbuja--cliente]="msg.rol === 'cliente'">
          <p class="burbuja-texto">{{ msg.contenido }}</p>

          <!-- Botones de confirmacion -->
          <div *ngIf="msg.tipo === 'confirmacion' && msg.rol === 'agente'" class="confirmacion-botones">
            <button class="btn-confirmar" (click)="enviarConfirmacion('Si, correcto')">Si</button>
            <button class="btn-rechazar" (click)="enviarConfirmacion('No, otro tramite')">No</button>
          </div>

          <!-- Indicador archivo -->
          <span *ngIf="msg.tipo === 'archivo'" class="tag-archivo">Archivo adjunto</span>

          <!-- Indicador estado -->
          <span *ngIf="msg.tipo === 'estado'" class="tag-estado">Actualizacion del tramite</span>
        </div>

        <span class="mensaje-hora">{{ formatHora(msg.timestamp) }}</span>
      </div>

      <!-- Indicador procesando -->
      <div *ngIf="procesando" class="mensaje-wrapper mensaje-wrapper--agente">
        <div class="burbuja burbuja--agente burbuja--procesando">
          <span class="punto"></span>
          <span class="punto"></span>
          <span class="punto"></span>
        </div>
      </div>

    </div>

    <!-- Barra de entrada -->
    <div class="input-area">
      <!-- Boton adjuntar -->
      <label class="btn-icono" title="Adjuntar archivo">
        <input
          type="file"
          hidden
          (change)="onArchivoSeleccionado($event)"
          [disabled]="procesando">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </label>

      <!-- Input texto -->
      <input
        type="text"
        class="input-mensaje"
        placeholder="Escribe tu consulta o usa el microfono..."
        [(ngModel)]="mensajeActual"
        (keyup.enter)="enviar()"
        [disabled]="procesando">

      <!-- Boton voz -->
      <button
        *ngIf="vozDisponible"
        class="btn-icono"
        [class.btn-icono--activo]="escuchandoVoz"
        (click)="toggleVoz()"
        [disabled]="procesando"
        title="Dictado por voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <!-- Boton enviar -->
      <button
        class="btn-enviar"
        (click)="enviar()"
        [disabled]="!mensajeActual.trim() || procesando">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
</div>
